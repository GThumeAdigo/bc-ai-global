                              - paragraph [ref=f11e4]: V E R T R A G L I C H E R E G E L U N G E N
                              - paragraph [ref=f11e5]: vor der Angebotsaufforderung
                              - paragraph [ref=f11e6]: "Stand: 20.12.2011"
                              - paragraph [ref=f11e7]: 1 ALLGEMEINER TEIL
                              - paragraph [ref=f11e8]: 1.1 Geltungsbereich, Allgemeines
                              - paragraph [ref=f11e9]: 1.1.1 Diese Vorbemerkungen sind ZUSÄTZLICHE TECHNISCHE
                              - paragraph [ref=f11e10]: VERTRAGSBEDINGUNGEN - ZTV.
                              - paragraph [ref=f11e11]: 1.1.2 Bei Widersprüchen zu den ZTV gelten vorrangig die
                              - paragraph [ref=f11e12]: Angaben im Leistungsverzeichnis.
                              - paragraph [ref=f11e13]: Bei Widersprüchen zwischen dem Leistungsverzeichnis und
                              - paragraph [ref=f11e14]: der bei Auftragsdurchführung maßgeblichen Zeichnung ist
                              - paragraph [ref=f11e15]: nach den Zeichnungen bzw. Plänen zu arbeiten; daraus
                              - paragraph [ref=f11e16]: entstehende Rechte des Auftragnehmers werden damit
                              - paragraph [ref=f11e17]: nicht eingeschränkt.
                              - paragraph [ref=f11e18]: 1.1.3 Die vom Auftragnehmer verwendeten
                              - paragraph [ref=f11e19]: Ausführungsunterlagen müssen den Freigabevermerk des
                              - paragraph [ref=f11e20]: Auftraggebers oder seines Architekten tragen, um
                              - paragraph [ref=f11e21]: Verwechslungen bei der Bauausführung zu vermeiden.
                              - paragraph [ref=f11e22]: Nicht freigegebene Unterlagen dürfen nicht verwendet
                              - paragraph [ref=f11e23]: werden.
                              - paragraph [ref=f11e24]: Dies entbindet den Auftragnehmer aber nicht von seiner
                              - paragraph [ref=f11e25]: eigenen Prüfungs- und Hinweispflicht. Diese bleiben
                              - paragraph [ref=f11e26]: unberührt.
                              - paragraph [ref=f11e27]: 1.1.4 Werden unter 2.1 des Besonderen Teils -
                              - paragraph [ref=f11e28]: Geltungsbereich - Allgemeine Technische
                              - paragraph [ref=f11e29]: Vertragsbedingungen der VOB/C (DIN 18299 ff.) genannt,
                              - paragraph [ref=f11e30]: so gelten die in diesen aufgeführten DIN bzw. DIN EN
                              - paragraph [ref=f11e31]: ohne besondere Erwähnung als Ausführungsgrundlage,
                              - paragraph [ref=f11e32]: Leistungs-
                              - paragraph [ref=f11e33]: und Gütebestimmung.
                              - paragraph [ref=f11e34]: 1.1.5 Die Bauleistungen sollen den allgemein
                              - paragraph [ref=f11e35]: anerkannten Regeln der Technik entsprechen.
                              - paragraph [ref=f11e36]: Sind bautechnische Regeln einzuhalten, so gilt
                              - paragraph [ref=f11e37]: grundsätzlich die zum Zeitpunkt der Abnahme in Kraft
                              - paragraph [ref=f11e38]: befindliche Vorschrift, sofern diese keinen eigenen
                              - paragraph [ref=f11e39]: späteren Gültigkeitsvermerk trägt. Für die Preisbildung
                              - paragraph [ref=f11e40]: gelten unabhängig davon die zum Zeitpunkt der
                              - paragraph [ref=f11e41]: Angebotsabgabe gültigen Vorschriften; ein
                              - paragraph [ref=f11e42]: Preisausgleich kann ggf. verlangt werden.
                              - paragraph [ref=f11e43]: 1.1.6 Auch wenn die VOB/B nicht als Ganzes vereinbart
                              - paragraph [ref=f11e44]: ist, gelten die Abschnitte 2 (Stoffe, Bauteile) und 3
                              - paragraph [ref=f11e45]: (Ausführung) der Allgemeinen Technischen
                              - paragraph [ref=f11e46]: Vertragsbedingungen (VOB/C). DIN 18300 ff. haben
                              - paragraph [ref=f11e47]: Vorrang vor DIN 18299 - Allgemeine Regelungen für
                              - paragraph [ref=f11e48]: Baurbeiten jeder Art -.
                              - paragraph [ref=f11e49]: 1.1.7 Kurzbezeichnungen in den Ausschreibungstexten und
                              - paragraph [ref=f11e50]: Leistungspositionen entsprechen den in diesen ZTV
                              - paragraph [ref=f11e51]: angegebenen Normen.
