                              - paragraph [ref=f7e4]: V E R T R A G L I C H E R E G E L U N G E N
                              - paragraph [ref=f7e5]: vor der Angebotsaufforderung
                              - paragraph [ref=f7e6]: "Stand: 20.12.2011"
                              - paragraph [ref=f7e7]: 1 ALLGEMEINER TEIL
                              - paragraph [ref=f7e8]: 1.1 Geltungsbereich, Allgemeines
                              - paragraph [ref=f7e9]: 1.1.1 Diese Vorbemerkungen sind ZUSÄTZLICHE TECHNISCHE
                              - paragraph [ref=f7e10]: VERTRAGSBEDINGUNGEN - ZTV.
                              - paragraph [ref=f7e11]: 1.1.2 Bei Widersprüchen zu den ZTV gelten vorrangig die
                              - paragraph [ref=f7e12]: Angaben im Leistungsverzeichnis.
                              - paragraph [ref=f7e13]: Bei Widersprüchen zwischen dem Leistungsverzeichnis und
                              - paragraph [ref=f7e14]: der bei Auftragsdurchführung maßgeblichen Zeichnung ist
                              - paragraph [ref=f7e15]: nach den Zeichnungen bzw. Plänen zu arbeiten; daraus
                              - paragraph [ref=f7e16]: entstehende Rechte des Auftragnehmers werden damit
                              - paragraph [ref=f7e17]: nicht eingeschränkt.
                              - paragraph [ref=f7e18]: 1.1.3 Die vom Auftragnehmer verwendeten
                              - paragraph [ref=f7e19]: Ausführungsunterlagen müssen den Freigabevermerk des
                              - paragraph [ref=f7e20]: Auftraggebers oder seines Architekten tragen, um
                              - paragraph [ref=f7e21]: Verwechslungen bei der Bauausführung zu vermeiden.
                              - paragraph [ref=f7e22]: Nicht freigegebene Unterlagen dürfen nicht verwendet
                              - paragraph [ref=f7e23]: werden.
                              - paragraph [ref=f7e24]: Dies entbindet den Auftragnehmer aber nicht von seiner
                              - paragraph [ref=f7e25]: eigenen Prüfungs- und Hinweispflicht. Diese bleiben
                              - paragraph [ref=f7e26]: unberührt.
                              - paragraph [ref=f7e27]: 1.1.4 Werden unter 2.1 des Besonderen Teils -
                              - paragraph [ref=f7e28]: Geltungsbereich - Allgemeine Technische
                              - paragraph [ref=f7e29]: Vertragsbedingungen der VOB/C (DIN 18299 ff.) genannt,
                              - paragraph [ref=f7e30]: so gelten die in diesen aufgeführten DIN bzw. DIN EN
                              - paragraph [ref=f7e31]: ohne besondere Erwähnung als Ausführungsgrundlage,
                              - paragraph [ref=f7e32]: Leistungs-
                              - paragraph [ref=f7e33]: und Gütebestimmung.
                              - paragraph [ref=f7e34]: 1.1.5 Die Bauleistungen sollen den allgemein
                              - paragraph [ref=f7e35]: anerkannten Regeln der Technik entsprechen.
                              - paragraph [ref=f7e36]: Sind bautechnische Regeln einzuhalten, so gilt
                              - paragraph [ref=f7e37]: grundsätzlich die zum Zeitpunkt der Abnahme in Kraft
                              - paragraph [ref=f7e38]: befindliche Vorschrift, sofern diese keinen eigenen
                              - paragraph [ref=f7e39]: späteren Gültigkeitsvermerk trägt. Für die Preisbildung
                              - paragraph [ref=f7e40]: gelten unabhängig davon die zum Zeitpunkt der
                              - paragraph [ref=f7e41]: Angebotsabgabe gültigen Vorschriften; ein
                              - paragraph [ref=f7e42]: Preisausgleich kann ggf. verlangt werden.
                              - paragraph [ref=f7e43]: 1.1.6 Auch wenn die VOB/B nicht als Ganzes vereinbart
                              - paragraph [ref=f7e44]: ist, gelten die Abschnitte 2 (Stoffe, Bauteile) und 3
                              - paragraph [ref=f7e45]: (Ausführung) der Allgemeinen Technischen
                              - paragraph [ref=f7e46]: Vertragsbedingungen (VOB/C). DIN 18300 ff. haben
                              - paragraph [ref=f7e47]: Vorrang vor DIN 18299 - Allgemeine Regelungen für
                              - paragraph [ref=f7e48]: Baurbeiten jeder Art -.
                              - paragraph [ref=f7e49]: 1.1.7 Kurzbezeichnungen in den Ausschreibungstexten und
                              - paragraph [ref=f7e50]: Leistungspositionen entsprechen den in diesen ZTV
                              - paragraph [ref=f7e51]: angegebenen Normen.
                              - paragraph [ref=f7e52]: ... (gekürzt)
