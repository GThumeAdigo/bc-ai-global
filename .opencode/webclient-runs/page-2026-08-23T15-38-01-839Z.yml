                          - iframe [ref=f130e1527]:
                            - generic [ref=f133e2]:
                              - text: Vorbemerkungen im Leistungsverzeichnis
                              - separator [ref=f133e3]
                              - text: Platzierung der Vorbemerkungen im Leistungsverzeichnis
                              - generic [ref=f133e4]:
                                - text: Da es in der VOB außer dem erwähnten Hinweis in der ATV DIN 18299 keinerlei weitere Regelungen oder Hinweise bezüglich der Vorbemerkungen gibt, wird in der VOB auch nicht festgelegt, wo die Vorbemerkungen in einem Leistungsverzeichnis aufzuführen sind. Allerdings macht der Begriff „Vorbemerkung“ bereits deutlich, dass die Vorbemerkungen immer vor den Leistungen, für die sie gelten sollen, platziert werden sollten. Eine andere Platzierung würde auch keinen praktischen Sinn ergeben und sicherlich käme auch kaum jemand auf eine solche Idee. Ansonsten bleibt es aber dem Ausschreibenden überlassen, ob er die Vorbemerkungen an den Anfang des gesamten Leistungsverzeichnisses stellt oder jeweils titelbezogene Vorbemerkungen an den Anfang der jeweiligen Titel stellt oder ob er sogar beide Varianten mischt. Es kann durchaus sinnvoll sein, an den Anfang eines Leistungsverzeichnisses Vorbemerkungen zu stellen, die nur solche Festlegungen enthalten, die nahezu alle Leistungen betreffen. Hier ist z.B. der oben zitierte Hinweis aus der ATV DIN 18299 am besten untergebracht. Die Titel können dann, wenn erforderlich, zusätzlich eigene Vorbemerkungen erhalten, in denen ausschließlich nur solche Regelungen aufgeführt werden, die ausschließlich die Leistungen des jeweiligen Titels betreffen.
                                - separator [ref=f133e5]
                                - text: Allgemeine Angaben
                                - separator [ref=f133e6]
                                - text: Alle Bauteile und Anschlüsse sind gemäß den geltenden DIN-Vorschriften zu erstellen. Details der Gewerke sind den Ausschreibungsunterlagen zu entnehmen. Sämtliche notwendigen Unfallverhütungsmaßnahmen sind eigenverantwortlich vom Auftragnehmer zu treffen. Unfallverhütungsvorschriften sind strikt einzuhalten. Nebenangebote sind zugelassen. Der Auftragnehmer verpflichtet sich, die übernommene Leistung nach Aufforderung zu beginnen und gemäßden im Bauzeitenplan vereinbarten Terminen fertig zu stellen. Die Baustelle ist jeden Tag besenrein zu verlassen. Alle Arbeiten und Termine sind mit der örtlichen Bauleitung abzustimmen. Fertigungen dürfen erst nach Freigabe der Detailpläne begonnen werden. Alle Maße in den Zeichnungen sind am Bau zu prüfen. Zeichnungen sind Grundsatzdetails. Änderungen im Sinne von Vereinfachungen sind in Absprache mit der Bauleitung möglich. Im Zweifelsfall zählt die Zeichnung vor dem geschriebenen Text. Ausschnitte, Durchbrüche, Bohrungen und Verstärkungen sind nach Erfordernis auszuführen. Der statische Nachweis des Tragwerkes ist für die Ausführung verbindlich (Genehmigung durch Prüfstatiker).
                                - generic [ref=f133e7]: "Folgende Leistungen sind in die Einheitspreise einzukalkulieren: Sämtliche Positionen des Leistungsverzeichnisses schließen Lieferung und Montage, Material und alle erforderlichen Nebenarbeiten sowie das Vorhalten des evtl. notwendigen Gerätes und die Gerüststellung ein. Die Einheitspreise verstehen sich für Lieferung und Montage in fix und fertiger Arbeit. Alle Kosten für sachgemäße Sicherung und Lagerung der Baustoffe, sämtliche Zulagen, die sich aufgrund der Geschosszahlen, der Geschosshöhen und der Transportwege auf der Baustelle ergeben, Statiken, soweit erforderlich, sind in die Preise einzukalkulieren. Der Auftragnehmer übernimmt die Gewährleistung für die Standfestigkeit seiner Konstruktion. Alle Kosten für Baustelleneinrichtung, Transporte, technische Bearbeitungen und Abnahmen soweit in den Leistungsverzeichnissen nicht gesondert aufgeführt, sind in den Einheitspreisen zu berücksichtigen. Sie werden nicht gesondert vergütet. Dem Auftragnehmer obliegt die ständige Reinigung der durch seine Arbeiten verschmutzten Straßen und Zuwegungen. Die Aufforderung hierzu erfolgt mündlich. Der Auftragnehmer ist verpflichtet, eine genügende Anzahl von Bezugspunkten (Meterstriche) im Rohbau einzunivellieren und an den Stützen zu markieren. Vor Baubeginn ist ein Bauzeitenplan vorzulegen und mit dem Auftraggeber abzustimmen, um Termine für die Fertigstellung einzelner Teillieferungen bzw. Bauabschnitte festzulegen. Der Auftragnehmer hat nach Fertigstellung der Arbeiten einen Bestandsplan zu erstellen. Diese Unterlagen müssen bei der Abnahme der Leistungen vorliegen. Der Auftraggeber behält sich vor 5 % der Auftragssumme einzubehalten bis die Unterlagen vollständig vorliegen. Finden die Bauarbeiten während der Winterzeit statt, ist bei Arbeiten, die witterungsabhängig sind, ein Schutz der Bauteile und Gräben vor Frost und anderen Witterungseinflüssen vorzusehen."
