                              - paragraph [ref=f77e13]: Bei Widersprüchen zwischen dem Leistungsverzeichnis und
                              - paragraph [ref=f77e14]: der bei Auftragsdurchführung maßgeblichen Zeichnung ist
                              - paragraph [ref=f77e15]: nach den Zeichnungen bzw. Plänen zu arbeiten; daraus
                              - paragraph [ref=f77e16]: entstehende Rechte des Auftragnehmers werden damit
                              - paragraph [ref=f77e17]: nicht eingeschränkt.
                              - paragraph [ref=f77e18]: 1.1.3 Die vom Auftragnehmer verwendeten
                              - paragraph [ref=f77e19]: Ausführungsunterlagen müssen den Freigabevermerk des
                              - paragraph [ref=f77e20]: Auftraggebers oder seines Architekten tragen, um
                              - paragraph [ref=f77e21]: Verwechslungen bei der Bauausführung zu vermeiden.
                              - paragraph [ref=f77e22]: Nicht freigegebene Unterlagen dürfen nicht verwendet
                              - paragraph [ref=f77e23]: werden.
                              - paragraph [ref=f77e24]: Dies entbindet den Auftragnehmer aber nicht von seiner
                              - paragraph [ref=f77e25]: eigenen Prüfungs- und Hinweispflicht. Diese bleiben
                              - paragraph [ref=f77e26]: unberührt.
                              - paragraph [ref=f77e27]: 1.1.4 Werden unter 2.1 des Besonderen Teils -
                              - paragraph [ref=f77e28]: Geltungsbereich - Allgemeine Technische
                              - paragraph [ref=f77e29]: Vertragsbedingungen der VOB/C (DIN 18299 ff.) genannt,
                              - paragraph [ref=f77e30]: so gelten die in diesen aufgeführten DIN bzw. DIN EN
                              - paragraph [ref=f77e31]: ohne besondere Erwähnung als Ausführungsgrundlage,
                              - paragraph [ref=f77e32]: Leistungs-
                              - paragraph [ref=f77e33]: und Gütebestimmung.
                              - paragraph [ref=f77e34]: 1.1.5 Die Bauleistungen sollen den allgemein
                              - paragraph [ref=f77e35]: anerkannten Regeln der Technik entsprechen.
                              - paragraph [ref=f77e36]: Sind bautechnische Regeln einzuhalten, so gilt
                              - paragraph [ref=f77e37]: grundsätzlich die zum Zeitpunkt der Abnahme in Kraft
                              - paragraph [ref=f77e38]: befindliche Vorschrift, sofern diese keinen eigenen
                              - paragraph [ref=f77e39]: späteren Gültigkeitsvermerk trägt. Für die Preisbildung
                              - paragraph [ref=f77e40]: gelten unabhängig davon die zum Zeitpunkt der
                              - paragraph [ref=f77e41]: Angebotsabgabe gültigen Vorschriften; ein
                              - paragraph [ref=f77e42]: Preisausgleich kann ggf. verlangt werden.
                              - paragraph [ref=f77e43]: 1.1.6 Auch wenn die VOB/B nicht als Ganzes vereinbart
                              - paragraph [ref=f77e44]: ist, gelten die Abschnitte 2 (Stoffe, Bauteile) und 3
                              - paragraph [ref=f77e45]: (Ausführung) der Allgemeinen Technischen
                              - paragraph [ref=f77e46]: Vertragsbedingungen (VOB/C). DIN 18300 ff. haben
                              - paragraph [ref=f77e47]: Vorrang vor DIN 18299 - Allgemeine Regelungen für
                              - paragraph [ref=f77e48]: Baurbeiten jeder Art -.
                              - paragraph [ref=f77e49]: 1.1.7 Kurzbezeichnungen in den Ausschreibungstexten und
                              - paragraph [ref=f77e50]: Leistungspositionen entsprechen den in diesen ZTV
                              - paragraph [ref=f77e51]: angegebenen Normen.
