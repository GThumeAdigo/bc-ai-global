                              - paragraph [ref=f73e14]: der bei Auftragsdurchführung maßgeblichen Zeichnung ist
                              - paragraph [ref=f73e15]: nach den Zeichnungen bzw. Plänen zu arbeiten; daraus
                              - paragraph [ref=f73e16]: entstehende Rechte des Auftragnehmers werden damit
                              - paragraph [ref=f73e17]: nicht eingeschränkt.
                              - paragraph [ref=f73e18]: 1.1.3 Die vom Auftragnehmer verwendeten
                              - paragraph [ref=f73e19]: Ausführungsunterlagen müssen den Freigabevermerk des
                              - paragraph [ref=f73e20]: Auftraggebers oder seines Architekten tragen, um
                              - paragraph [ref=f73e21]: Verwechslungen bei der Bauausführung zu vermeiden.
                              - paragraph [ref=f73e22]: Nicht freigegebene Unterlagen dürfen nicht verwendet
                              - paragraph [ref=f73e23]: werden.
                              - paragraph [ref=f73e24]: Dies entbindet den Auftragnehmer aber nicht von seiner
                              - paragraph [ref=f73e25]: eigenen Prüfungs- und Hinweispflicht. Diese bleiben
                              - paragraph [ref=f73e26]: unberührt.
                              - paragraph [ref=f73e27]: 1.1.4 Werden unter 2.1 des Besonderen Teils -
                              - paragraph [ref=f73e28]: Geltungsbereich - Allgemeine Technische
                              - paragraph [ref=f73e29]: Vertragsbedingungen der VOB/C (DIN 18299 ff.) genannt,
                              - paragraph [ref=f73e30]: so gelten die in diesen aufgeführten DIN bzw. DIN EN
                              - paragraph [ref=f73e31]: ohne besondere Erwähnung als Ausführungsgrundlage,
                              - paragraph [ref=f73e32]: Leistungs-
                              - paragraph [ref=f73e33]: und Gütebestimmung.
                              - paragraph [ref=f73e34]: 1.1.5 Die Bauleistungen sollen den allgemein
                              - paragraph [ref=f73e35]: anerkannten Regeln der Technik entsprechen.
                              - paragraph [ref=f73e36]: Sind bautechnische Regeln einzuhalten, so gilt
                              - paragraph [ref=f73e37]: grundsätzlich die zum Zeitpunkt der Abnahme in Kraft
                              - paragraph [ref=f73e38]: befindliche Vorschrift, sofern diese keinen eigenen
                              - paragraph [ref=f73e39]: späteren Gültigkeitsvermerk trägt. Für die Preisbildung
                              - paragraph [ref=f73e40]: gelten unabhängig davon die zum Zeitpunkt der
                              - paragraph [ref=f73e41]: Angebotsabgabe gültigen Vorschriften; ein
                              - paragraph [ref=f73e42]: Preisausgleich kann ggf. verlangt werden.
                              - paragraph [ref=f73e43]: 1.1.6 Auch wenn die VOB/B nicht als Ganzes vereinbart
                              - paragraph [ref=f73e44]: ist, gelten die Abschnitte 2 (Stoffe, Bauteile) und 3
                              - paragraph [ref=f73e45]: (Ausführung) der Allgemeinen Technischen
                              - paragraph [ref=f73e46]: Vertragsbedingungen (VOB/C). DIN 18300 ff. haben
                              - paragraph [ref=f73e47]: Vorrang vor DIN 18299 - Allgemeine Regelungen für
                              - paragraph [ref=f73e48]: Baurbeiten jeder Art -.
                              - paragraph [ref=f73e49]: 1.1.7 Kurzbezeichnungen in den Ausschreibungstexten und
                              - paragraph [ref=f73e50]: Leistungspositionen entsprechen den in diesen ZTV
                              - paragraph [ref=f73e51]: angegebenen Normen.
                              - paragraph [ref=f73e52]: ... (gekürzt)
